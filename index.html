<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>My Map</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Map">
<meta name="theme-color" content="#1f7a5c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --accent: #1f7a5c; --bg: #ffffff; --fg: #1b1f1d; --muted: #66706b;
    --line: rgba(0,0,0,.1); --shadow: 0 6px 22px rgba(0,0,0,.2);
    --glass-tint: rgba(255,255,255,.42); --glass-panel: rgba(255,255,255,.62);
    --glass-edge: rgba(255,255,255,.7); --glass-shine: rgba(255,255,255,.55);
    --fab: 52px; --top: env(safe-area-inset-top); --bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d2120; --fg: #eef2f0; --muted: #a2ada8; --line: rgba(255,255,255,.12); --shadow: 0 6px 22px rgba(0,0,0,.5);
      --glass-tint: rgba(40,44,42,.38); --glass-panel: rgba(32,36,34,.6); --glass-edge: rgba(255,255,255,.22); --glass-shine: rgba(255,255,255,.18); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  #map { position: fixed; inset: 0; background: #dde3e0; }

  /* ---------- Surfaces: solid vs liquid glass ---------- */
  .surface { background: var(--bg); box-shadow: var(--shadow); }
  body.glass .surface {
    background: linear-gradient(140deg, var(--glass-shine), transparent 48%), var(--glass-panel);
    -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%);
    border: 1px solid var(--glass-edge);
    box-shadow: 0 10px 30px rgba(0,0,0,.22), inset 0 1px 1px var(--glass-shine), inset 0 -1px 1px rgba(255,255,255,.08);
  }
  body.glass .fab.surface { background: linear-gradient(150deg, var(--glass-shine), transparent 55%), var(--glass-tint); }

  /* ---------- Search ---------- */
  #searchWrap { position: fixed; z-index: 1000; left: 12px; right: 12px; top: calc(var(--top) + 10px); }
  #searchForm { display: flex; border-radius: 16px; overflow: hidden; }
  #q { flex: 1; border: 0; padding: 13px 14px; font-size: 17px; background: transparent; color: var(--fg); outline: none; min-width: 0; }
  #q::placeholder { color: var(--muted); }
  #q::-webkit-search-cancel-button, #q::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  #searchForm button { border: 0; background: transparent; color: var(--muted); font-size: 20px; padding: 0 14px; }
  #results { margin-top: 6px; border-radius: 16px; max-height: 50vh; overflow-y: auto; display: none; }
  #results.show { display: block; }
  .row { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row b { display: block; font-weight: 600; }
  .row small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Round buttons ---------- */
  #fabs { position: fixed; z-index: 1000; right: 12px; bottom: calc(var(--bottom) + 24px); display: flex; flex-direction: column; gap: 10px; }
  body.left #fabs { right: auto; left: 12px; }
  .fab { width: var(--fab); height: var(--fab); border-radius: 50%; border: 0; color: var(--accent);
    display: grid; place-items: center; transition: transform .15s ease; }
  .fab:active { transform: scale(.9); }
  .fab svg { width: calc(var(--fab) * .46); height: calc(var(--fab) * .46); }
  .fab.on { color: #fff; background: var(--accent) !important; }
  body.glass .fab.on { background: linear-gradient(150deg, rgba(255,255,255,.45), transparent 55%), color-mix(in srgb, var(--accent) 78%, transparent) !important; }

  /* ---------- Bottom bars ---------- */
  .bottomBar { position: fixed; z-index: 1000; left: 12px; right: calc(var(--fab) + 24px); bottom: calc(var(--bottom) + 24px);
    border-radius: 18px; padding: 10px 12px; display: none; }
  body.left .bottomBar { left: calc(var(--fab) + 24px); right: 12px; }
  .bottomBar.show { display: block; }
  .bottomBar .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .big { font-weight: 700; font-size: 18px; }
  .sub { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: flex; gap: 6px; margin-top: 8px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 10px; padding: 7px 0; font-size: 14px; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .primary { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 16px; }
  .primary:disabled { opacity: .45; }
  .danger { background: #d93a3a; }
  .x { border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 0 4px; }
  .iconBtn { border: 0; background: var(--line); color: var(--fg); border-radius: 12px; width: 44px; height: 42px; font-size: 19px; }

  /* ---------- Navigation banner ---------- */
  #navBanner { position: fixed; z-index: 1000; left: 12px; right: 12px; top: calc(var(--top) + 10px);
    border-radius: 20px; padding: 12px 14px; display: none; gap: 12px; align-items: center; }
  #navBanner.show { display: flex; }
  #navArrow { flex: none; width: 54px; height: 54px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 26px; }
  #navArrow svg { width: 34px; height: 34px; transition: transform .2s; }
  #navDist { font-size: 26px; font-weight: 700; line-height: 1.1; }
  #navText { font-size: 17px; font-weight: 600; }
  #navThen { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ---------- Sheets ---------- */
  .sheet { position: fixed; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 78vh;
    border-radius: 22px 22px 0 0; transform: translateY(110%); transition: transform .28s ease;
    display: flex; flex-direction: column; padding-bottom: var(--bottom); }
  body.glass .sheet { border-bottom: 0; }
  .sheet.show { transform: none; }
  .sheet header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
  .sheet h2 { margin: 0; font-size: 20px; }
  .sheetBody { overflow-y: auto; padding: 0 16px 18px; }
  .fav { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .fav .row { flex: 1; min-width: 0; border: 0; padding-left: 0; }
  .fav button { border: 0; background: transparent; color: var(--muted); padding: 12px 8px; font-size: 15px; }
  .empty { color: var(--muted); padding: 8px 0 24px; }
  .label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  .label:first-child { margin-top: 4px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .hint a { color: var(--accent); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
  .sw.on { border-color: var(--bg); box-shadow: 0 0 0 2px var(--fg); }
  #customColor { width: 38px; height: 38px; border: 0; padding: 0; background: none; }
  .switchRow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; gap: 12px; }
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 31px; background: var(--line); transition: .2s; }
  .switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .field { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 16px; }
  select.field { -webkit-appearance: none; appearance: none; }
  .styles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .styleOpt { border: 2px solid transparent; background: none; padding: 0; color: var(--fg); font-size: 13px; border-radius: 14px; }
  .styleOpt img, .styleOpt .ph { display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; background: var(--line); }
  .styleOpt.on { border-color: var(--accent); }
  .styleOpt div { padding: 4px 0 2px; }

  /* ---------- Popups & toast ---------- */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg); color: var(--fg); }
  body.glass .leaflet-popup-content-wrapper { background: var(--glass-panel); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-edge); }
  body.glass .leaflet-popup-tip { background: var(--glass-panel); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 15px; min-width: 190px; }
  .pop-title { font-weight: 600; margin-bottom: 2px; }
  .pop-sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .pop-btns { display: flex; gap: 6px; }
  .pop-btns button { flex: 1; border: 0; border-radius: 10px; padding: 8px 10px; font-size: 14px; background: var(--accent); color: #fff; white-space: nowrap; }
  .pop-btns button.alt { background: var(--line); color: var(--fg); }
  #toast { position: fixed; z-index: 1200; left: 50%; top: calc(var(--top) + 80px); transform: translateX(-50%);
    background: rgba(20,20,20,.85); color: #fff; padding: 9px 14px; border-radius: 12px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }

  .me { position: relative; width: 22px; height: 22px; }
  .me-dot { position: absolute; inset: 2px; border-radius: 50%; background: #2b7bff; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(43,123,255,.35); }
  .cone { position: absolute; left: -9px; top: -9px; width: 40px; height: 40px; display: none;
    background: radial-gradient(circle at 50% 100%, rgba(43,123,255,.55), transparent 70%); clip-path: polygon(50% 50%, 25% 0, 75% 0); }
  .leaflet-control-attribution { font-size: 10px; margin-bottom: var(--bottom) !important; }
  .leaflet-control-zoom { display: none; }
</style>
</head>
<body class="glass">
<div id="map"></div>

<div id="searchWrap">
  <form id="searchForm" class="surface" autocomplete="off">
    <input id="q" type="search" placeholder="Search places or addresses" enterkeyhint="search">
    <button type="button" id="clearQ" aria-label="Clear">✕</button>
  </form>
  <div id="results" class="surface"></div>
</div>

<div id="navBanner" class="surface">
  <div id="navArrow"></div>
  <div style="min-width:0;flex:1">
    <div id="navDist"></div>
    <div id="navText"></div>
    <div id="navThen"></div>
  </div>
</div>

<div id="routeBar" class="bottomBar surface">
  <div class="top">
    <div style="min-width:0">
      <div class="big" id="routeStats">Routing…</div>
      <div class="sub" id="routeTo"></div>
    </div>
    <button class="primary" id="goBtn" disabled>Go</button>
    <button class="x" id="routeClose" aria-label="Clear route">✕</button>
  </div>
  <div class="seg" id="modes">
    <button data-mode="car">🚗 Drive</button>
    <button data-mode="foot">🚶 Walk</button>
    <button data-mode="bike">🚲 Bike</button>
  </div>
</div>

<div id="navBar" class="bottomBar surface">
  <div class="top">
    <div style="min-width:0">
      <div class="big" id="navEta"></div>
      <div class="sub" id="navRemain"></div>
    </div>
    <button class="iconBtn" id="muteBtn" aria-label="Voice on or off">🔊</button>
    <button class="primary danger" id="endBtn">End</button>
  </div>
</div>

<div id="fabs">
  <button class="fab surface" id="layersBtn" aria-label="Map style">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 8l11 6 11-6zM3.3 11.6 1 12.9l11 6 11-6-2.3-1.3L12 16.4zm0 4.6L1 17.5l11 6 11-6-2.3-1.3L12 21z"/></svg>
  </button>
  <button class="fab surface" id="favBtn" aria-label="Favorites">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.3l-6.2 3.7 1.7-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.5 4.8 1.7 7z"/></svg>
  </button>
  <button class="fab surface" id="setBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
  </button>
  <button class="fab surface" id="locBtn" aria-label="My location">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3L3 10.5l7.5 3 3 7.5z"/></svg>
  </button>
</div>

<!-- Map style sheet -->
<div class="sheet surface" id="layersSheet">
  <header><h2>Map</h2><button class="x" data-close aria-label="Close">✕</button></header>
  <div class="sheetBody">
    <div class="label">Style</div>
    <div class="styles" id="styles"></div>
  </div>
</div>

<!-- Favorites sheet -->
<div class="sheet surface" id="favSheet">
  <header><h2>Favorites</h2><button class="x" data-close aria-label="Close">✕</button></header>
  <div class="sheetBody" id="favList"></div>
</div>

<!-- Settings sheet -->
<div class="sheet surface" id="setSheet">
  <header><h2>Customize</h2><button class="x" data-close aria-label="Close">✕</button></header>
  <div class="sheetBody">
    <div class="label">Button style</div>
    <div class="seg" id="optLook"><button data-v="glass">💧 Liquid Glass</button><button data-v="solid">⬤ Solid</button></div>

    <div class="label">Accent color</div>
    <div class="swatches" id="swatches"></div>

    <div class="label">Button size</div>
    <div class="seg" id="optSize"><button data-v="44">Small</button><button data-v="52">Medium</button><button data-v="62">Large</button></div>

    <div class="label">Buttons on</div>
    <div class="seg" id="optSide"><button data-v="left">Left</button><button data-v="right">Right</button></div>

    <div class="label">Voice directions</div>
    <div class="switchRow"><div>Speak turn-by-turn directions</div><label class="switch"><input type="checkbox" id="voiceToggle"><span></span></label></div>
    <select class="field" id="voiceSel"></select>
    <div class="seg"><button id="testVoice">▶︎ Test voice</button></div>

    <div class="label">Units</div>
    <div class="seg" id="optUnits"><button data-v="auto">Auto</button><button data-v="mi">Miles</button><button data-v="km">Kilometers</button></div>

  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  const darkMQ = matchMedia('(prefers-color-scheme: dark)');

  // ================= Settings =================
  const DEFAULTS = { look: 'glass', accent: '#1f7a5c', size: '52', side: 'right', voice: true, voiceURI: '',
    units: 'auto', style: 'standard', mode: 'car' };
  const S = Object.assign({}, DEFAULTS, store.get('settings', {}));
  const save = () => store.set('settings', S);
  const ACCENTS = ['#1f7a5c', '#0a84ff', '#5e5ce6', '#bf5af2', '#ff375f', '#ff9f0a', '#30b0c7', '#3a3a3c'];

  function applyLook() {
    document.body.classList.toggle('glass', S.look === 'glass');
    document.body.classList.toggle('left', S.side === 'left');
    document.documentElement.style.setProperty('--accent', S.accent);
    document.documentElement.style.setProperty('--fab', S.size + 'px');
    document.querySelector('meta[name=theme-color]').content = S.accent;
    markSeg('optLook', S.look); markSeg('optSize', S.size); markSeg('optSide', S.side); markSeg('optUnits', S.units);
    document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === S.accent));
    $('customColor') && ($('customColor').value = S.accent);
    $('voiceToggle').checked = S.voice;
    $('muteBtn').textContent = S.voice ? '🔊' : '🔇';
  }
  function markSeg(id, v) { document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
  function bindSeg(id, key, after) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => { S[key] = b.dataset.v; save(); applyLook(); after && after(); });
  }
  bindSeg('optLook', 'look'); bindSeg('optSize', 'size'); bindSeg('optSide', 'side'); bindSeg('optUnits', 'units', () => nav && renderNav());
  $('swatches').innerHTML = ACCENTS.map(c => `<button class="sw" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('') +
    '<input type="color" id="customColor" aria-label="Custom color">';
  document.querySelectorAll('.sw').forEach(b => b.onclick = () => { S.accent = b.dataset.c; save(); applyLook(); });
  $('customColor').oninput = e => { S.accent = e.target.value; save(); applyLook(); };
  $('voiceToggle').onchange = e => { S.voice = e.target.checked; save(); applyLook(); };

  // ================= Map & styles =================
  const last = store.get('view', { lat: 39.5, lng: -98.35, z: 4 });
  const map = L.map('map', { zoomControl: false, tap: false }).setView([last.lat, last.lng], last.z);
  map.on('moveend', () => { const c = map.getCenter(); store.set('view', { lat: c.lat, lng: c.lng, z: map.getZoom() }); });

  const esriAttr = 'Imagery &copy; Esri, Maxar, Earthstar Geographics';
  const osmAttr = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const esri = p => `https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
  const STYLES = {
    standard: { name: 'Standard', layers: () => [L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: osmAttr })],
      preview: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png` },
    satellite: { name: 'Satellite', layers: () => [L.tileLayer(esri('World_Imagery'), { maxZoom: 19, maxNativeZoom: 18, attribution: esriAttr })],
      preview: (z, x, y) => esri('World_Imagery').replace('{z}', z).replace('{y}', y).replace('{x}', x) },
    hybrid: { name: 'Hybrid', layers: () => [
        L.tileLayer(esri('World_Imagery'), { maxZoom: 19, maxNativeZoom: 18, attribution: esriAttr }),
        L.tileLayer(esri('Reference/World_Transportation'), { maxZoom: 19, maxNativeZoom: 18, opacity: .9 }),
        L.tileLayer(esri('Reference/World_Boundaries_and_Places'), { maxZoom: 19, maxNativeZoom: 18 })],
      preview: (z, x, y) => esri('World_Imagery').replace('{z}', z).replace('{y}', y).replace('{x}', x) },
    dark: { name: 'Dark', layers: () => [
        L.tileLayer(esri('Canvas/World_Dark_Gray_Base'), { maxZoom: 19, maxNativeZoom: 16, attribution: 'Map &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }),
        L.tileLayer(esri('Canvas/World_Dark_Gray_Reference'), { maxZoom: 19, maxNativeZoom: 16 })],
      preview: (z, x, y) => esri('Canvas/World_Dark_Gray_Base').replace('{z}', Math.min(z, 16)).replace('{y}', y >> Math.max(0, z - 16)).replace('{x}', x >> Math.max(0, z - 16)) }
  };
  let baseLayers = [];
  function setStyle(key) {
    if (!STYLES[key]) key = 'standard';
    S.style = key; save();
    baseLayers.forEach(l => map.removeLayer(l));
    baseLayers = STYLES[key].layers();
    baseLayers.forEach((l, i) => l.setZIndex(i + 1).addTo(map));
    document.querySelectorAll('.styleOpt').forEach(b => b.classList.toggle('on', b.dataset.s === key));
  }
  function renderStyleOptions() {
    const c = map.getCenter(), z = Math.min(Math.max(map.getZoom(), 3), 15);
    const n = 2 ** z, x = Math.floor((c.lng + 180) / 360 * n);
    const r = c.lat * Math.PI / 180, y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
    $('styles').innerHTML = Object.entries(STYLES).map(([k, s]) =>
      `<button class="styleOpt ${k === S.style ? 'on' : ''}" data-s="${k}"><img alt="" src="${s.preview(z, x, y)}"><div>${s.name}</div></button>`).join('');
    document.querySelectorAll('.styleOpt').forEach(b => b.onclick = () => setStyle(b.dataset.s));
  }


  // ================= Sheets =================
  function openSheet(id) {
    closeSheets();
    $(id).classList.add('show');

  function closeSheets() {

  $('layersBtn').onclick = () => { renderStyleOptions(); toggleSheet('layersSheet'); };
  $('favBtn').onclick = () => toggleSheet('favSheet');
  $('setBtn').onclick = () => { loadVoices(); toggleSheet('setSheet'); };

  // ================= Voice =================
  let voices = [];
  function loadVoices() {
    if (!('speechSynthesis' in window)) { $('voiceSel').innerHTML = '<option>Voice not supported on this device</option>'; return; }
    voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    $('voiceSel').innerHTML = '<option value="">Default voice</option>' +
      voices.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI === S.voiceURI ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  }
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;
  $('voiceSel').onchange = e => { S.voiceURI = e.target.value; save(); };
  function speak(text, force) {
    if ((!S.voice && !force) || !('speechSynthesis' in window) || !text) return;

    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(v => v.voiceURI === S.voiceURI);

  }
  $('testVoice').onclick = () => speak('In 500 feet, turn right onto Main Street', true);
  $('muteBtn').onclick = () => { S.voice = !S.voice; save(); applyLook(); if (!S.voice) speechSynthesis?.cancel(); };

  // ================= Units =================
  const imperial = () => S.units === 'mi' || (S.units === 'auto' && /^en-(US|LR|MM)/.test(navigator.language));
  function fmtDist(m, spoken) {
    if (imperial()) {
      const ft = m * 3.281;

      const mi = m / 1609.34, v = mi < 10 ? mi.toFixed(1) : Math.round(mi);

    if (m < 1000) { const r = Math.max(10, Math.round(m / (m < 300 ? 10 : 50)) * (m < 300 ? 10 : 50)); return spoken ? `${r} meters` : `${r} m`; }
    const km = m / 1000, v = km < 10 ? km.toFixed(1) : Math.round(km);
    return spoken ? `${v} kilometers` : `${v} km`;
  }
  const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h} h ${m} min` : `${Math.max(1, m)} min`; };

  // ================= Live location =================
  let me = null, meAcc = 999, meMarker = null, meCircle = null, watchId = null, follow = false;
  function startLocating(center) {
    if (!navigator.geolocation) { toast('Location is not available on this device'); return; }
    follow = center;
    if (watchId !== null) { if (me && center) map.flyTo(me, Math.max(map.getZoom(), nav ? 17 : 16)); return; }
    $('locBtn').classList.add('on');
    watchId = navigator.geolocation.watchPosition(onPosition, err => {
      toast(err.code === 1 ? 'Location permission denied. Allow it in Settings › Privacy › Location Services › Safari Websites.' : 'Could not get your location');
      stopLocating();
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  }
  function onPosition(pos) {
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    const first = !me; me = ll; meAcc = pos.coords.accuracy;
    if (!meMarker) {
      meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"><div class="cone"></div><div class="me-dot"></div></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), zIndexOffset: 1000, interactive: false }).addTo(map);
      meCircle = L.circle(ll, { radius: meAcc, color: '#2b7bff', weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
    } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(meAcc); }
    const cone = meMarker.getElement()?.querySelector('.cone'), h = pos.coords.heading;
    if (cone) { const ok = h !== null && !isNaN(h) && (pos.coords.speed ?? 1) > 0.5; cone.style.display = ok ? 'block' : 'none'; if (ok) cone.style.transform = `rotate(${h}deg)`; }
    if (first && follow) map.flyTo(ll, nav ? 17 : 16);
    else if (follow) map.panTo(ll, { animate: true, duration: .5 });
    if (first && pendingRoute) { const p = pendingRoute; pendingRoute = null; routeTo(p.ll, p.name); }
    if (nav) navUpdate();
  }
  function stopLocating() {

  }
  map.on('dragstart', () => { follow = false; });
  $('locBtn').onclick = () => startLocating(true);

  // ================= Place popups =================
  let tempMarker = null;
  const pinIcon = L.divIcon({ className: '', iconSize: [30, 40], iconAnchor: [15, 38], popupAnchor: [0, -34],
    html: '<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 1C7.3 1 1 7.2 1 14.8 1 25.5 15 39 15 39s14-13.5 14-24.2C29 7.2 22.7 1 15 1z" fill="#e5383b" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="5" fill="#fff"/></svg>' });
  function placePopup(ll, name, sub, opts = {}) {
    const div = document.createElement('div');
    div.innerHTML = `<div class="pop-title">${esc(name)}</div>
      <div class="pop-sub">${esc(sub || `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`)}</div>
      <div class="pop-btns"><button data-a="route">Directions</button>
        ${opts.favId ? '<button class="alt" data-a="unsave">Remove ★</button>' : '<button class="alt" data-a="save">Save ★</button>'}</div>`;
    div.onclick = e => {
      const a = e.target.dataset.a; if (!a) return;
      map.closePopup();
      if (a === 'route') routeTo(ll, name);
      if (a === 'save') saveFav(ll, name, sub);
      if (a === 'unsave') removeFav(opts.favId);
    };
    return div;
  }
  function showTemp(ll, name, sub) {
    if (tempMarker) map.removeLayer(tempMarker);
    tempMarker = L.marker(ll, { icon: pinIcon }).addTo(map).bindPopup(placePopup(ll, name, sub)).openPopup();
    return tempMarker;
  }
  map.on('click', async e => {
    if (document.querySelector('.sheet.show')) { closeSheets(); return; }
    if ($('results').classList.contains('show')) { $('results').classList.remove('show'); return; }
    if (nav) return;
    const ll = e.latlng;
    const m = showTemp(ll, 'Dropped pin', 'Looking up address…');
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${ll.lat}&lon=${ll.lng}&zoom=18`, { headers: { 'Accept-Language': navigator.language } });
      const d = await r.json();
      if (m !== tempMarker) return;
      const a = d.address || {};
      const name = d.name || (a.road ? `${a.house_number ? a.house_number + ' ' : ''}${a.road}` : '') || 'Dropped pin';
      m.setPopupContent(placePopup(ll, name, d.display_name));
    } catch { if (m === tempMarker) m.setPopupContent(placePopup(ll, 'Dropped pin')); }
  });

  // ================= Search =================
  let searchTimer, searchSeq = 0;
  async function search(q, show) {
    const seq = ++searchSeq, b = map.getBounds();
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&q=${encodeURIComponent(q)}&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
    try {
      const list = await (await fetch(url, { headers: { 'Accept-Language': navigator.language } })).json();
      if (seq !== searchSeq) return;
      const box = $('results');
      box.innerHTML = list.length ? '' : '<div class="row"><small>No results</small></div>';
      list.forEach(p => {
        const name = p.name || p.display_name.split(',')[0];
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<b>${esc(name)}</b><small>${esc(p.display_name)}</small>`;
        row.onclick = () => {
          box.classList.remove('show'); $('q').blur();
          const ll = L.latLng(+p.lat, +p.lon);
          if (p.boundingbox) { const [s, n, w, e] = p.boundingbox.map(Number); map.flyToBounds([[s, w], [n, e]], { maxZoom: 17 }); }
          else map.flyTo(ll, 16);
          showTemp(ll, name, p.display_name);

    } catch { if (show) toast('Search failed. Check your connection.'); }
  }
  $('q').addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = $('q').value.trim();

  });
  $('searchForm').onsubmit = e => { e.preventDefault(); clearTimeout(searchTimer); const q = $('q').value.trim(); if (q) search(q, true); };
  $('clearQ').onclick = () => { $('q').value = ''; $('results').classList.remove('show'); if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; } };

  // ================= Favorites =================
  let favs = store.get('favorites', []);
  const favLayer = L.layerGroup().addTo(map);
  const favIcon = () => L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -12],
    html: '<div style="width:28px;height:28px;border-radius:50%;background:#f5a623;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font-size:14px">★</div>' });
  function drawFavs() {
    favLayer.clearLayers();
    favs.forEach(f => { const ll = L.latLng(f.lat, f.lng); L.marker(ll, { icon: favIcon() }).bindPopup(() => placePopup(ll, f.name, f.sub, { favId: f.id })).addTo(favLayer); });
    const list = $('favList');
    if (!favs.length) { list.innerHTML = '<div class="empty">No favorites yet. Tap the map or search for a place, then tap “Save ★”.</div>'; return; }
    list.innerHTML = '';
    favs.forEach(f => {
      const el = document.createElement('div');
      el.className = 'fav';
      el.innerHTML = `<div class="row"><b>${esc(f.name)}</b><small>${esc(f.sub || '')}</small></div>
        <button data-a="go">Go</button><button data-a="rename">Rename</button><button data-a="del">Delete</button>`;
      el.querySelector('.row').onclick = () => { closeSheets(); map.flyTo([f.lat, f.lng], 16); };
      el.querySelector('[data-a=go]').onclick = () => routeTo(L.latLng(f.lat, f.lng), f.name);
      el.querySelector('[data-a=rename]').onclick = () => { const n = prompt('Name this place', f.name); if (n && n.trim()) { f.name = n.trim(); store.set('favorites', favs); drawFavs(); } };
      el.querySelector('[data-a=del]').onclick = () => { if (confirm(`Delete “${f.name}”?`)) removeFav(f.id); };
      list.appendChild(el);
    });
  }
  function saveFav(ll, name, sub) {
    const n = prompt('Name this place', name === 'Dropped pin' ? '' : name);
    if (n === null) return;
    favs.push({ id: Date.now().toString(36), name: n.trim() || name, sub: sub || '', lat: ll.lat, lng: ll.lng });
    store.set('favorites', favs);
    if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
    drawFavs(); toast('Saved to favorites');
  }
  function removeFav(id) { favs = favs.filter(f => f.id !== id); store.set('favorites', favs); drawFavs(); }

  // ================= Routing =================
  let routeLine = null, routeCasing = null, routeDest = null, pendingRoute = null, currentRoute = null;
  document.querySelectorAll('#modes button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === S.mode);
    b.onclick = () => {
      S.mode = b.dataset.mode; save();
      document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
      if (routeDest) routeTo(routeDest.ll, routeDest.name, true);
    };
  });
  async function fetchRoute(from, to) {
    const profile = { car: 'routed-car', foot: 'routed-foot', bike: 'routed-bike' }[S.mode];
    const url = `https://routing.openstreetmap.de/${profile}/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson&steps=true`;
    const d = await (await fetch(url)).json();
    if (!d.routes || !d.routes.length) throw new Error('no route');
    return d.routes[0];
  }
  function drawRoute(rt) {
    if (routeLine) { map.removeLayer(routeLine); map.removeLayer(routeCasing); }
    routeCasing = L.geoJSON(rt.geometry, { interactive: false, style: { color: '#0b3d91', weight: 10, opacity: .5 } }).addTo(map);
    routeLine = L.geoJSON(rt.geometry, { interactive: false, style: { color: '#2b7bff', weight: 6, opacity: .95 } }).addTo(map);
  }
  async function routeTo(ll, name, keepView) {
    closeSheets();
    if (!me) { pendingRoute = { ll, name }; toast('Finding your location first…'); startLocating(false); return; }
    routeDest = { ll, name };
    $('routeBar').classList.add('show');
    $('routeStats').textContent = 'Routing…';
    $('routeTo').textContent = 'To ' + name;
    $('goBtn').disabled = true;
    try {
      const rt = await fetchRoute(me, ll);
      currentRoute = rt; drawRoute(rt);
      $('routeStats').textContent = `${fmtTime(rt.duration)} · ${fmtDist(rt.distance)}`;
      $('goBtn').disabled = false;
      if (!keepView) { follow = false; map.fitBounds(routeLine.getBounds(), { paddingTopLeft: [30, 90], paddingBottomRight: [30, 160] }); }
    } catch { $('routeStats').textContent = 'No route found'; currentRoute = null; }
  }
  function clearRoute() {
    if (routeLine) { map.removeLayer(routeLine); map.removeLayer(routeCasing); }
    routeLine = routeCasing = routeDest = currentRoute = null;
    $('routeBar').classList.remove('show');
  }
  $('routeClose').onclick = clearRoute;

  // ================= Turn-by-turn navigation =================
  const ordinal = n => ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth'][n - 1] || `${n}th`;
  const compass = b => ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round(((b % 360) + 360) % 360 / 45) % 8];
  function instruction(step) {
    const m = step.maneuver, mod = m.modifier || 'straight';
    const road = step.name || step.ref || '', onto = road ? ` onto ${road}` : '';
    const side = mod.includes('left') ? 'left' : mod.includes('right') ? 'right' : '';
    switch (m.type) {
      case 'depart': return `Head ${compass(m.bearing_after || 0)}${road ? ' on ' + road : ''}`;
      case 'arrive': return side ? `You have arrived. Your destination is on the ${side}` : 'You have arrived at your destination';
      case 'roundabout': case 'rotary': return m.exit ? `At the roundabout, take the ${ordinal(m.exit)} exit${onto}` : `Enter the roundabout${onto}`;
      case 'roundabout turn': return `At the roundabout, turn ${mod}${onto}`;
      case 'exit roundabout': case 'exit rotary': return `Exit the roundabout${onto}`;
      case 'merge': return `Merge${side ? ' ' + side : ''}${onto}`;
      case 'on ramp': return `Take the ramp${side ? ' on the ' + side : ''}${onto}`;
      case 'off ramp': return `Take the exit${side ? ' on the ' + side : ''}${onto}`;
      case 'fork': return `Keep ${side || 'straight'} at the fork${onto}`;
      case 'end of road': return `At the end of the road, turn ${side || mod}${onto}`;
      case 'notification': return null;
      case 'new name': case 'continue':
        if (mod === 'uturn') return 'Make a U-turn';
        return mod === 'straight' ? `Continue straight${onto}` : `Keep ${side}${onto}`;
      default:
        if (mod === 'uturn') return `Make a U-turn${onto}`;
        if (mod === 'straight') return `Continue straight${onto}`;
        return `Turn ${mod}${onto}`;
    }
  }
  const ARROW_ROT = { 'straight': 0, 'slight right': 45, 'right': 90, 'sharp right': 135, 'uturn': 180, 'sharp left': -135, 'left': -90, 'slight left': -45 };
  const arrowSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 11h5v11h6V11h5z"/></svg>';
  function arrowFor(step) {
    if (!step) return arrowSVG;
    if (step.type === 'arrive') return '🏁';
    if (/roundabout|rotary/.test(step.type)) return '⟳';
    const rot = ARROW_ROT[step.mod] ?? 0;
    return arrowSVG.replace('<svg ', `<svg style="transform:rotate(${rot}deg)" `);
  }

  let nav = null, wakeLock = null;
  function buildSteps(rt) {
    return rt.legs[0].steps.map(s => ({ text: instruction(s), type: s.maneuver.type, mod: s.maneuver.modifier || 'straight',
      loc: L.latLng(s.maneuver.location[1], s.maneuver.location[0]), dist: s.distance, dur: s.duration }))
      .filter(s => s.text)
      .map(s => {
        // "In 500 feet, ..." wording
        const side = s.mod.includes('left') ? 'left' : s.mod.includes('right') ? 'right' : '';
        s.pre = s.type === 'arrive' ? (side ? `your destination will be on the ${side}` : 'you will arrive at your destination')
          : s.text.charAt(0).toLowerCase() + s.text.slice(1);
        return s;
      });
  }
  const thresholds = () => ({ car: { far: 400, near: 80 }, bike: { far: 200, near: 30 }, foot: { far: 100, near: 20 } })[S.mode];

  function startNav() {
    if (!currentRoute || !me) return;
    const steps = buildSteps(currentRoute);
    nav = { steps, next: Math.min(1, steps.length - 1), minD: Infinity, said: {}, coords: currentRoute.geometry.coordinates,
      off: 0, lastReroute: 0, rerouting: false };
    $('routeBar').classList.remove('show'); $('searchWrap').style.display = 'none';
    $('navBanner').classList.add('show'); $('navBar').classList.add('show');
    follow = true; map.setView(me, 17);
    startLocating(true);
    requestWake();
    const first = steps[0], nxt = steps[nav.next];
    const d = me.distanceTo(nxt.loc);
    // Speaking here, inside the tap, also unlocks speech on iPhone.
    speak(`${first.text}. Then, in ${fmtDist(d, true)}, ${nxt.pre}`);
    if (d < thresholds().far * 1.5) nav.said[nav.next + 'f'] = true;
    renderNav();
  }
  function endNav(msg) {
    nav = null;
    $('navBanner').classList.remove('show'); $('navBar').classList.remove('show'); $('searchWrap').style.display = '';
    releaseWake(); clearRoute();
    if (msg) toast(msg);
  }
  $('goBtn').onclick = startNav;
  $('endBtn').onclick = () => { speechSynthesis?.cancel(); endNav(); };

  // Distance in meters from point p to the route line
  function distToRoute(p) {
    const k = Math.cos(p.lat * Math.PI / 180) * 111320, kl = 110540;
    let best = Infinity;
    const c = nav.coords;
    for (let i = 1; i < c.length; i++) {
      const ax = (c[i - 1][0] - p.lng) * k, ay = (c[i - 1][1] - p.lat) * kl, bx = (c[i][0] - p.lng) * k, by = (c[i][1] - p.lat) * kl;
      const dx = bx - ax, dy = by - ay, len = dx * dx + dy * dy;
      const t = len ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len)) : 0;
      const d = Math.hypot(ax + t * dx, ay + t * dy);
      if (d < best) best = d;
    }
    return best;
  }

  function navUpdate() {
    if (!nav || !me || nav.rerouting) return;
    const T = thresholds();
    let st = nav.steps[nav.next];
    let d = me.distanceTo(st.loc);
    nav.minD = Math.min(nav.minD, d);

    // Reached (or just passed) the maneuver?
    if (d < (st.type === 'arrive' ? 30 : 20) || (nav.minD < 45 && d > nav.minD + 25)) {
      if (st.type === 'arrive' || nav.next >= nav.steps.length - 1) { speak(nav.steps[nav.steps.length - 1].text); endNav('You have arrived'); return; }
      nav.next++; nav.minD = Infinity;
      st = nav.steps[nav.next]; d = me.distanceTo(st.loc);
      if (d > T.near * 2) { speak(`In ${fmtDist(d, true)}, ${st.pre}`); if (d < T.far * 1.5) nav.said[nav.next + 'f'] = true; }
    }

    // Spoken prompts
    if (!nav.said[nav.next + 'f'] && d < T.far && d > T.near * 2) {
      nav.said[nav.next + 'f'] = true; speak(`In ${fmtDist(d, true)}, ${st.pre}`);
    }
    if (!nav.said[nav.next + 'n'] && d < T.near) {
      nav.said[nav.next + 'n'] = true;
      const after = nav.steps[nav.next + 1];
      speak(after && after.type !== 'arrive' && st.loc.distanceTo(after.loc) < 150 ? `${st.text}, then ${after.pre}` : st.text);
    }

    // Off route? Re-route.
    const off = distToRoute(me);
    nav.off = (off > (S.mode === 'car' ? 50 : 35) && meAcc < 60) ? nav.off + 1 : 0;
    if (nav.off >= 3 && Date.now() - nav.lastReroute > 15000) reroute();
    renderNav(d);
  }
  async function reroute() {
    if (!nav || !routeDest) return;
    nav.rerouting = true; nav.lastReroute = Date.now();
    speak('Rerouting');
    $('navText').textContent = 'Rerouting…';
    try {
      const rt = await fetchRoute(me, routeDest.ll);
      if (!nav) return;
      currentRoute = rt; drawRoute(rt);
      Object.assign(nav, { steps: buildSteps(rt), next: 1, minD: Infinity, said: {}, coords: rt.geometry.coordinates, off: 0 });
      nav.next = Math.min(1, nav.steps.length - 1);
      const st = nav.steps[nav.next], d = me.distanceTo(st.loc);
      setTimeout(() => speak(`In ${fmtDist(d, true)}, ${st.pre}`), 1200);
      if (d < thresholds().far * 1.5) nav.said[nav.next + 'f'] = true;
    } catch { toast('Could not reroute'); }
    if (nav) { nav.rerouting = false; renderNav(); }
  }
  function renderNav(d) {
    if (!nav) return;
    const st = nav.steps[nav.next], after = nav.steps[nav.next + 1];
    if (d === undefined) d = me ? me.distanceTo(st.loc) : st.dist;
    $('navArrow').innerHTML = arrowFor(st);
    $('navDist').textContent = fmtDist(d);
    $('navText').textContent = st.text;
    $('navThen').textContent = after ? `Then: ${after.text}` : '';
    let remain = d, secs = 0;
    const cur = nav.steps[nav.next - 1];
    if (cur && cur.dist > 0) secs += cur.dur * Math.min(1, d / cur.dist);
    for (let i = nav.next; i < nav.steps.length; i++) { remain += nav.steps[i].dist; secs += nav.steps[i].dur; }
    const eta = new Date(Date.now() + secs * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('navEta').textContent = `${fmtTime(secs)} · ${fmtDist(remain)}`;
    $('navRemain').textContent = `Arrive ${eta}`;
  }

  // Keep the screen on while navigating
  async function requestWake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
  function releaseWake() { try { wakeLock?.release(); } catch {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => { if (nav && document.visibilityState === 'visible') requestWake(); });

  // ================= Start up =================
  applyLook();
  setStyle(S.style);
  drawFavs();
  loadVoices();
  if (navigator.permissions) {
    navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') startLocating(!store.get('view', null)); }).catch(() => {});
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
